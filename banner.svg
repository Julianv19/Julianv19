    <rect x="596" y="78"  width="16" height="16"/>
    <rect x="580" y="94"  width="16" height="16"/>
    <rect x="564" y="110" width="16" height="16"/>
    <rect x="580" y="126" width="16" height="16"/>
    <rect x="596" y="142" width="16" height="16"/>
