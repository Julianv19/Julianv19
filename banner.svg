<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" shape-rendering="crispEdges" font-family="monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="900" height="240" fill="url(#sky)"/>
  <rect width="900" height="240" fill="url(#glow)"/>
  <rect x="4" y="4" width="892" height="232" fill="none" stroke="#21262d" stroke-width="4"/>
  <!-- Acentos de esquina -->
  <g>
    <rect x="4" y="4" width="14" height="14" fill="#58a6ff"/>
    <rect x="882" y="4" width="14" height="14" fill="#f0883e"/>
    <rect x="4" y="222" width="14" height="14" fill="#f0883e"/>
    <rect x="882" y="222" width="14" height="14" fill="#58a6ff"/>
  </g>

  <!-- Piso retro -->
  <g fill="#1b2230">
    <rect x="8" y="206" width="884" height="3"/>
    <rect x="8" y="216" width="884" height="2"/>
    <rect x="8" y="226" width="884" height="2"/>
  </g>
  <g fill="#30363d">
    <rect x="120" y="206" width="2" height="24"/>
    <rect x="300" y="206" width="2" height="24"/>
    <rect x="480" y="206" width="2" height="24"/>
    <rect x="660" y="206" width="2" height="24"/>
    <rect x="800" y="206" width="2" height="24"/>
  </g>

  <!-- Estrellas (algunas titilan) -->
  <g fill="#30363d">
    <rect x="60" y="30" width="4" height="4"/>
    <rect x="180" y="52" width="3" height="3"/>
    <rect x="250" y="26" width="4" height="4"/>
    <rect x="330" y="44" width="3" height="3"/>
    <rect x="470" y="30" width="4" height="4"/>
    <rect x="520" y="60" width="3" height="3"/>
    <rect x="610" y="34" width="3" height="3"/>
    <rect x="690" y="150" width="3" height="3"/>
    <rect x="860" y="150" width="4" height="4"/>
    <rect x="430" y="150" width="3" height="3"/>
  </g>
  <g fill="#58a6ff">
    <rect x="150" y="34" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="400" y="60" width="4" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="640" y="56" width="4" height="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="560" y="28" width="3" height="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#c9d1d9">
    <rect x="220" y="150" width="3" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="760" y="30" width="3" height="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Estrella fugaz -->
  <g fill="#c9d1d9" opacity="0.9">
    <rect x="300" y="24" width="10" height="3"/>
    <rect x="312" y="22" width="6" height="3"/>
    <rect x="320" y="20" width="4" height="4"/>
  </g>

  <!-- Planeta con anillo (arriba derecha) -->
  <g>
    <circle cx="828" cy="52" r="20" fill="#30363d"/>
    <circle cx="821" cy="46" r="5" fill="#484f58"/>
    <circle cx="834" cy="58" r="3" fill="#484f58"/>
    <ellipse cx="828" cy="52" rx="32" ry="9" fill="none" stroke="#58a6ff" stroke-width="3" transform="rotate(-20 828 52)"/>
  </g>

  <!-- ===== Monitor retro ===== -->
  <rect x="76" y="48" width="184" height="128" fill="#161b22" stroke="#484f58" stroke-width="4"/>
  <rect x="96" y="64" width="144" height="88" fill="#010409"/>
  <g>
    <rect x="104" y="74"  width="40" height="8" fill="#ff7b72"/>
    <rect x="148" y="74"  width="56" height="8" fill="#79c0ff"/>
    <rect x="112" y="88"  width="64" height="8" fill="#d2a8ff"/>
    <rect x="180" y="88"  width="24" height="8" fill="#a5d6ff"/>
    <rect x="112" y="102" width="40" height="8" fill="#7ee787"/>
    <rect x="156" y="102" width="48" height="8" fill="#ffa657"/>
    <rect x="104" y="116" width="72" height="8" fill="#79c0ff"/>
    <rect x="112" y="130" width="48" height="8" fill="#d2a8ff"/>
    <rect x="164" y="130" width="20" height="8" fill="#7ee787"/>
  </g>
  <!-- cursor parpadeante -->
  <rect x="188" y="130" width="8" height="8" fill="#ffffff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  <g fill="#0d1117" opacity="0.25">
    <rect x="96" y="70" width="144" height="2"/>
    <rect x="96" y="86" width="144" height="2"/>
    <rect x="96" y="102" width="144" height="2"/>
    <rect x="96" y="118" width="144" height="2"/>
    <rect x="96" y="134" width="144" height="2"/>
  </g>
  <rect x="152" y="176" width="32" height="14" fill="#30363d"/>
  <rect x="124" y="190" width="88" height="8" fill="#484f58"/>

  <!-- ===== Emblema { J } (llaves de código + inicial) ===== -->
  <g>
    <!-- llave izquierda { -->
    <g fill="#58a6ff">
      <rect x="272" y="104" width="8" height="8"/><rect x="280" y="104" width="8" height="8"/>
      <rect x="272" y="112" width="8" height="8"/>
      <rect x="272" y="120" width="8" height="8"/>
      <rect x="264" y="128" width="8" height="8"/>
      <rect x="272" y="136" width="8" height="8"/>
      <rect x="272" y="144" width="8" height="8"/>
      <rect x="272" y="152" width="8" height="8"/><rect x="280" y="152" width="8" height="8"/>
    </g>
    <!-- J -->
    <g fill="#f0883e">
      <rect x="296" y="104" width="8" height="8"/><rect x="304" y="104" width="8" height="8"/><rect x="312" y="104" width="8" height="8"/>
      <rect x="304" y="112" width="8" height="8"/>
      <rect x="304" y="120" width="8" height="8"/>
      <rect x="304" y="128" width="8" height="8"/>
      <rect x="304" y="136" width="8" height="8"/>
      <rect x="296" y="144" width="8" height="8"/><rect x="304" y="144" width="8" height="8"/>
    </g>
    <!-- llave derecha } -->
    <g fill="#58a6ff">
      <rect x="320" y="104" width="8" height="8"/><rect x="328" y="104" width="8" height="8"/>
      <rect x="328" y="112" width="8" height="8"/>
      <rect x="328" y="120" width="8" height="8"/>
      <rect x="336" y="128" width="8" height="8"/>
      <rect x="328" y="136" width="8" height="8"/>
      <rect x="328" y="144" width="8" height="8"/>
      <rect x="320" y="152" width="8" height="8"/><rect x="328" y="152" width="8" height="8"/>
    </g>
  </g>

  <!-- ===== Taza de café ===== -->
  <g>
    <rect x="360" y="112" width="84" height="12" fill="#ffa657"/>
    <rect x="364" y="124" width="76" height="60" fill="#f0883e"/>
    <rect x="368" y="124" width="68" height="8" fill="#3d2415"/>
    <rect x="444" y="130" width="20" height="8" fill="#ffa657"/>
    <rect x="456" y="138" width="8" height="24" fill="#ffa657"/>
    <rect x="444" y="162" width="20" height="8" fill="#ffa657"/>
    <rect x="352" y="184" width="100" height="8" fill="#484f58"/>
    <!-- vapor animado -->
    <g fill="#8b949e">
      <rect x="378" y="92" width="8" height="8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="386" y="84" width="8" height="8"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="394" y="92" width="8" height="8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="410" y="92" width="8" height="8"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="418" y="84" width="8" height="8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- ===== Signo </> en pixel ===== -->
  <g fill="#58a6ff">
    <rect x="560" y="82"  width="16" height="16"/>
    <rect x="544" y="98"  width="16" height="16"/>
    <rect x="528" y="114" width="16" height="16"/>
    <rect x="544" y="130" width="16" height="16"/>
    <rect x="560" y="146" width="16" height="16"/>
    <rect x="672" y="82"  width="16" height="16"/>
    <rect x="688" y="98"  width="16" height="16"/>
    <rect x="704" y="114" width="16" height="16"/>
    <rect x="688" y="130" width="16" height="16"/>
    <rect x="672" y="146" width="16" height="16"/>
  </g>
  <g fill="#c9d1d9">
    <rect x="592" y="146" width="16" height="16"/>
    <rect x="608" y="130" width="16" height="16"/>
    <rect x="624" y="114" width="16" height="16"/>
    <rect x="640" y="98"  width="16" height="16"/>
    <rect x="656" y="82"  width="16" height="16"/>
  </g>

  <!-- ===== Cohete pixel (abajo derecha) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3s" repeatCount="indefinite"/>
    <!-- cuerpo -->
    <rect x="816" y="120" width="24" height="40" fill="#c9d1d9"/>
    <rect x="820" y="112" width="16" height="12" fill="#c9d1d9"/>
    <rect x="824" y="104" width="8" height="10" fill="#f0883e"/>
    <!-- ventana -->
    <rect x="822" y="128" width="12" height="12" fill="#1f6feb"/>
    <!-- aletas -->
    <rect x="808" y="148" width="8" height="16" fill="#f0883e"/>
    <rect x="840" y="148" width="8" height="16" fill="#f0883e"/>
    <!-- llama -->
    <rect x="820" y="160" width="16" height="8" fill="#ffd33d"/>
    <rect x="824" y="168" width="8" height="8" fill="#f0883e"><animate attributeName="opacity" values="1;0.3;1" dur="0.6s" repeatCount="indefinite"/></rect>
  </g>
</svg>
